services:
  - type: web
    name: kgu-salary-auditor
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    aptPackages:
      - tesseract-ocr
      - tesseract-ocr-rus
      - tesseract-ocr-eng
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12